server:
  port: ${PORT:8081}

spring:
  application:
    name: suraksha-backend
  datasource:
    # MySQL locally, TiDB Cloud in production (same driver, same URL shape).
    # TiDB Cloud example:
    # jdbc:mysql://gateway01.<region>.prod.aws.tidbcloud.com:4000/suraksha?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/suraksha?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  jackson:
    default-property-inclusion: non_null

suraksha:
  cors:
    # Comma separated list of allowed frontend origins.
    allowed-origins: ${CORS_ORIGINS:http://localhost:8080,http://localhost:5173,http://localhost:3000}
  ai:
    base-url: ${AI_BASE_URL:https://ai.gateway.lovable.dev/v1}
    api-key: ${LOVABLE_API_KEY:}
    model: ${AI_MODEL:google/gemini-3.8-flash}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.suraksha: INFO
