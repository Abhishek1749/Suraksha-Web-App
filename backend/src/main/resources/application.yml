spring:
  datasource:
    url: ${MYSQL_URL:}
    username: ${MYSQL_USER:}
    password: ${MYSQL_PASSWORD:}
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:0014bcb5cd0f4aab95490fef36f96852338b4d86eeee479989279dfd6460d214}
  expiration: ${JWT_EXPIRATION:86400000}

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  phone-number: ${TWILIO_PHONE_NUMBER:}

suraksha:
  cors:
    allowed-origins: ${CORS_ORIGINS:https://suraksha-web-app.onrender.com}
